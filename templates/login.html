{% extends "base.html" %}
{% block content %}
<div class="login-wrap">
  <div class="login-box">
    <div class="login-icon"></div>
    <h2>管理员登录</h2>
    <p class="login-sub">输入密码以记录今日心情</p>
    {% if error %}
      <p class="error-msg">{{ error }}</p>
    {% endif %}
    <form method="POST">
      <div class="form-group">
        <input type="password" name="password" placeholder="管理员密码" required autofocus>
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg">登录</button>
    </form>
  </div>
</div>
{% endblock %}
